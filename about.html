<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>About - Steem Flags</title>

<link rel="stylesheet" href="css/style.css?v=20260819-09">
</head>

<body>

<div id="app">
  <main class="appShell">
    <section class="card hero">
      Loading...
    </section>
  </main>
</div>

  <script src="https://unpkg.com/dsteem@0.11.3/dist/dsteem.js"></script>
<script src="js/config.js?v=20260819-09"></script>
<script src="js/standard-flags.js?v=20260819-09"></script>
<script type="module" src="js/app-v2.js?v=20260819-09"></script>

<script>
async function loadAbout(){

const app=document.getElementById("app");

const shell=await fetch("./components/app-shell.html?v="+Date.now());
app.innerHTML=await shell.text();


const home=document.getElementById("homeView");
const login=document.getElementById("loginView");
const game=document.getElementById("gameView");


if(home) home.hidden=false;
if(login) login.hidden=true;
if(game) game.hidden=true;


home.innerHTML=`

<section class="card">

<h1>ℹ️ About Steem Flags</h1>

<p>
Steem Flags is a flag guessing game built for the Steem ecosystem.
</p>

<p>
Players answer 20 flag questions and earn SF rewards.
</p>

<p>
Your progress is tracked through the Point Leaderboard.
</p>

<hr>

<p>
Developed by Mehdi Q.
</p>

</section>

`;

}

loadAbout();
</script>

</body>
</html>
