<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080d1a"><meta name="description" content="About Steem Flags"><title>About - Steem Flags</title><link rel="stylesheet" href="css/style.css?v=20260830-footer-01"><link rel="stylesheet" href="css/preloader.css?v=20260826-01"><script src="js/preloader.js?v=20260826-01" defer></script><script src="js/d2e-logo.js?v=20260825-02" defer></script></head><body><div id="app"></div><script type="module">
import {getStoredUsername,loadState,refreshDailyEnergy,syncPurchasedEnergy} from './js/storage.js?v=20260822-about-01';import {loadMenu} from './js/menu.js?v=20260820-05';import {loadAssetBar as loadSharedAssetBar,refreshAssetBar} from './js/asset-bar.js?v=20260826-assetbar-04';import {getLanguage} from './js/i18n.js';
const ABOUT_TRANSLATIONS={
 en:{title:'About Steem Flags',p1:'Steem Flags is a Web 3.0 game based on the Steem blockchain network in the quiz and educational genres, created and developed by Mehdi Q. from Persia.',p2:'In Steem Flags, players increase their geographical knowledge by answering questions about the flags of countries around the world and earn points in a competitive environment.',economy:'Steem Flags Economy',p3:'In Steem Flags, players can receive non-cashable in-game tokens called D2E (Do2Earn) as rewards based on their daily energy component by participating in the game process and watching video ads (in the future). These rewards are calculated based on the player\'s performance, correct answers, and activity in the game.',p4:'By collecting D2E, players can compete on the leaderboard and improve their position among other players. In the future, a weekly Steem reward pool will be activated in-game, distributing between 20 and 100 $STEEM to the top 5 players on the leaderboard, based on their D2E holdings. The Steem Flags reward system is designed to incentivize further learning, active participation, and healthy competition.',back:'Back to Game'},
 ur:{title:'Steem Flags کے بارے میں',p1:'Steem Flags ایک Web 3.0 گیم ہے جو Steem بلاک چین نیٹ ورک پر مبنی ہے اور کوئز اور تعلیمی انواع میں شامل ہے۔ اسے فارس سے تعلق رکھنے والے Mehdi Q. نے تخلیق اور تیار کیا ہے۔',p2:'Steem Flags میں کھلاڑی دنیا بھر کے ممالک کے جھنڈوں سے متعلق سوالات کے جواب دے کر اپنی جغرافیائی معلومات میں اضافہ کرتے ہیں اور مسابقتی ماحول میں پوائنٹس کماتے ہیں۔',economy:'Steem Flags کی معیشت',p3:'Steem Flags میں کھلاڑی گیم میں شرکت اور مستقبل میں ویڈیو اشتہارات دیکھنے کے ذریعے اپنی روزانہ کی توانائی کی بنیاد پر D2E (Do2Earn) نامی غیر نقدی درونِ گیم ٹوکن بطور انعام حاصل کر سکتے ہیں۔ یہ انعامات کھلاڑی کی کارکردگی، درست جوابات اور گیم میں سرگرمی کی بنیاد پر شمار کیے جاتے ہیں۔',p4:'D2E جمع کر کے کھلاڑی لیڈر بورڈ میں مقابلہ کر سکتے ہیں اور دوسرے کھلاڑیوں کے مقابلے میں اپنی پوزیشن بہتر بنا سکتے ہیں۔ مستقبل میں گیم میں ہفتہ وار Steem ریوارڈ پول فعال کیا جائے گا، جس میں D2E ہولڈنگز کی بنیاد پر لیڈر بورڈ کے ٹاپ 5 کھلاڑیوں میں 20 سے 100 $STEEM تقسیم کیے جائیں گے۔ Steem Flags کا ریوارڈ سسٹم مزید سیکھنے، فعال شرکت اور صحت مند مقابلے کی حوصلہ افزائی کے لیے بنایا گیا ہے۔',back:'گیم پر واپس جائیں'},
 hi:{title:'Steem Flags के बारे में',p1:'Steem Flags एक Web 3.0 गेम है जो Steem ब्लॉकचेन नेटवर्क पर आधारित है और क्विज़ तथा शैक्षिक श्रेणियों में आता है। इसे फारस के Mehdi Q. ने बनाया और विकसित किया है।',p2:'Steem Flags में खिलाड़ी दुनिया भर के देशों के झंडों से जुड़े प्रश्नों के उत्तर देकर अपना भौगोलिक ज्ञान बढ़ाते हैं और प्रतिस्पर्धी वातावरण में अंक अर्जित करते हैं।',economy:'Steem Flags अर्थव्यवस्था',p3:'Steem Flags में खिलाड़ी गेम में भाग लेकर और भविष्य में वीडियो विज्ञापन देखकर अपनी दैनिक ऊर्जा के आधार पर D2E (Do2Earn) नामक गैर-नकदी इन-गेम टोकन पुरस्कार के रूप में प्राप्त कर सकते हैं। ये पुरस्कार खिलाड़ी के प्रदर्शन, सही उत्तरों और गेम में गतिविधि के आधार पर निर्धारित होते हैं।',p4:'D2E जमा करके खिलाड़ी लीडरबोर्ड पर प्रतिस्पर्धा कर सकते हैं और अन्य खिलाड़ियों के बीच अपनी स्थिति बेहतर कर सकते हैं। भविष्य में गेम में साप्ताहिक Steem रिवॉर्ड पूल सक्रिय किया जाएगा, जिसमें D2E होल्डिंग्स के आधार पर लीडरबोर्ड के शीर्ष 5 खिलाड़ियों के बीच 20 से 100 $STEEM वितरित किए जाएंगे। Steem Flags का रिवॉर्ड सिस्टम आगे सीखने, सक्रिय भागीदारी और स्वस्थ प्रतिस्पर्धा को प्रोत्साहित करने के लिए बनाया गया है।',back:'गेम पर वापस जाएँ'},
 bn:{title:'Steem Flags সম্পর্কে',p1:'Steem Flags একটি Web 3.0 গেম, যা Steem ব্লকচেইন নেটওয়ার্কের উপর ভিত্তি করে তৈরি এবং কুইজ ও শিক্ষামূলক ঘরানার অন্তর্ভুক্ত। এটি পারস্যের Mehdi Q. তৈরি ও উন্নয়ন করেছেন।',p2:'Steem Flags-এ খেলোয়াড়রা বিশ্বের বিভিন্ন দেশের পতাকা সম্পর্কে প্রশ্নের উত্তর দিয়ে তাদের ভৌগোলিক জ্ঞান বাড়ায় এবং প্রতিযোগিতামূলক পরিবেশে পয়েন্ট অর্জন করে।',economy:'Steem Flags অর্থনীতি',p3:'Steem Flags-এ খেলোয়াড়রা গেমে অংশগ্রহণ এবং ভবিষ্যতে ভিডিও বিজ্ঞাপন দেখার মাধ্যমে তাদের দৈনিক শক্তির ভিত্তিতে D2E (Do2Earn) নামের নগদে রূপান্তরযোগ্য নয় এমন ইন-গেম টোকেন পুরস্কার হিসেবে পেতে পারে। এই পুরস্কার খেলোয়াড়ের পারফরম্যান্স, সঠিক উত্তর এবং গেমে সক্রিয়তার ভিত্তিতে গণনা করা হয়।',p4:'D2E সংগ্রহ করে খেলোয়াড়রা লিডারবোর্ডে প্রতিযোগিতা করতে এবং অন্যান্য খেলোয়াড়দের তুলনায় নিজেদের অবস্থান উন্নত করতে পারে। ভবিষ্যতে গেমে একটি সাপ্তাহিক Steem রিওয়ার্ড পুল চালু হবে, যেখানে D2E হোল্ডিংসের ভিত্তিতে লিডারবোর্ডের শীর্ষ 5 খেলোয়াড়ের মধ্যে 20 থেকে 100 $STEEM বিতরণ করা হবে। Steem Flags-এর রিওয়ার্ড সিস্টেম আরও শেখা, সক্রিয় অংশগ্রহণ এবং স্বাস্থ্যকর প্রতিযোগিতাকে উৎসাহিত করার জন্য তৈরি করা হয়েছে।',back:'গেমে ফিরে যান'},
 fa:{title:'درباره Steem Flags',p1:'Steem Flags یک بازی Web 3.0 بر بستر شبکه بلاک‌چین Steem در سبک‌های مسابقه‌ای و آموزشی است که توسط Mehdi Q. از سرزمین پارس ایجاد و توسعه داده شده است.',p2:'در Steem Flags، بازیکنان با پاسخ دادن به پرسش‌هایی درباره پرچم کشورهای سراسر جهان، دانش جغرافیایی خود را افزایش می‌دهند و در یک محیط رقابتی امتیاز کسب می‌کنند.',economy:'اقتصاد Steem Flags',p3:'در Steem Flags، بازیکنان می‌توانند با شرکت در فرایند بازی و در آینده با تماشای تبلیغات ویدیویی، بر اساس بخش انرژی روزانه خود، توکن‌های درون‌بازی غیرقابل تبدیل به پول نقد به نام D2E (Do2Earn) دریافت کنند. این پاداش‌ها بر اساس عملکرد بازیکن، پاسخ‌های صحیح و فعالیت او در بازی محاسبه می‌شوند.',p4:'بازیکنان با جمع‌آوری D2E می‌توانند در لیدربورد رقابت کنند و جایگاه خود را در میان سایر بازیکنان بهبود دهند. در آینده، یک استخر پاداش هفتگی Steem در بازی فعال خواهد شد که بر اساس موجودی D2E، بین ۲۰ تا ۱۰۰ $STEEM میان ۵ بازیکن برتر لیدربورد توزیع می‌کند. سیستم پاداش Steem Flags برای تشویق به یادگیری بیشتر، مشارکت فعال و رقابت سالم طراحی شده است.',back:'بازگشت به بازی'},
 es:{title:'Acerca de Steem Flags',p1:'Steem Flags es un juego Web 3.0 basado en la red blockchain de Steem, dentro de los géneros de preguntas y educación, creado y desarrollado por Mehdi Q. de Persia.',p2:'En Steem Flags, los jugadores aumentan sus conocimientos geográficos respondiendo preguntas sobre las banderas de países de todo el mundo y ganan puntos en un entorno competitivo.',economy:'Economía de Steem Flags',p3:'En Steem Flags, los jugadores pueden recibir tokens no canjeables por dinero llamados D2E (Do2Earn) como recompensas, según su energía diaria, al participar en el juego y, en el futuro, al ver anuncios de vídeo. Estas recompensas se calculan según el rendimiento del jugador, sus respuestas correctas y su actividad en el juego.',p4:'Al acumular D2E, los jugadores pueden competir en la clasificación y mejorar su posición frente a otros jugadores. En el futuro, se activará un fondo semanal de recompensas Steem que distribuirá entre 20 y 100 $STEEM a los 5 mejores jugadores de la clasificación según sus D2E. El sistema de recompensas de Steem Flags está diseñado para incentivar el aprendizaje, la participación activa y una competencia saludable.',back:'Volver al juego'},
 zh:{title:'关于 Steem Flags',p1:'Steem Flags 是一款基于 Steem 区块链网络的 Web 3.0 游戏，属于问答和教育类游戏，由来自波斯的 Mehdi Q. 创建并开发。',p2:'在 Steem Flags 中，玩家通过回答世界各国国旗相关的问题来提升地理知识，并在竞技环境中获得积分。',economy:'Steem Flags 经济系统',p3:'在 Steem Flags 中，玩家可以通过参与游戏，并在未来观看视频广告，根据每日能量获得名为 D2E（Do2Earn）的不可兑换现金的游戏内代币奖励。这些奖励根据玩家的表现、正确答案和游戏活动计算。',p4:'通过积累 D2E，玩家可以在排行榜上竞争并提升自己的排名。未来，游戏将启用每周 Steem 奖励池，根据 D2E 持有量向排行榜前 5 名玩家分配 20 至 100 $STEEM。Steem Flags 奖励系统旨在鼓励持续学习、积极参与和健康竞争。',back:'返回游戏'},
 ko:{title:'Steem Flags 소개',p1:'Steem Flags는 Steem 블록체인 네트워크를 기반으로 한 Web 3.0 게임으로, 퀴즈 및 교육 장르에 속하며 페르시아 출신의 Mehdi Q.가 제작하고 개발했습니다.',p2:'Steem Flags에서 플레이어는 전 세계 국가의 국기에 관한 질문에 답하며 지리 지식을 높이고 경쟁적인 환경에서 포인트를 획득합니다.',economy:'Steem Flags 경제',p3:'Steem Flags에서 플레이어는 게임에 참여하고 향후 동영상 광고를 시청하여 일일 에너지에 따라 D2E(Do2Earn)라는 현금으로 교환할 수 없는 게임 내 토큰을 보상으로 받을 수 있습니다. 보상은 플레이어의 성과, 정답 및 게임 활동을 기준으로 계산됩니다.',p4:'D2E를 모으면 플레이어는 리더보드에서 경쟁하고 다른 플레이어보다 순위를 높일 수 있습니다. 향후 게임에 주간 Steem 보상 풀이 활성화되며, D2E 보유량을 기준으로 리더보드 상위 5명에게 20~100 $STEEM을 분배합니다. Steem Flags 보상 시스템은 지속적인 학습, 적극적인 참여 및 건전한 경쟁을 장려하도록 설계되었습니다.',back:'게임으로 돌아가기'}
};
function renderAbout(){const t=ABOUT_TRANSLATIONS[getLanguage()]||ABOUT_TRANSLATIONS.en;document.documentElement.lang=getLanguage();document.documentElement.dir=['fa','ur'].includes(getLanguage())?'rtl':'ltr';document.title=t.title+' - Steem Flags';const main=document.querySelector('main.appShell');if(!main)return;main.innerHTML=`<section class="aboutContent"><img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags logo"><h1>${t.title}</h1><div class="aboutText"><p>${t.p1}</p><p>${t.p2}</p><h2>${t.economy}</h2><p>${t.p3}</p><p>${t.p4}</p></div><a href="./" class="primary">${t.back}</a></section>`}
async function loadAboutPage(){const app=document.getElementById('app');const response=await fetch('./components/app-shell.html?v=20260830-footer-01',{cache:'no-store'});app.innerHTML=await response.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());const main=document.querySelector('main.appShell');if(main)main.innerHTML='<section class="aboutContent"></section>';const username=getStoredUsername();await loadSharedAssetBar();if(username){await syncPurchasedEnergy(refreshDailyEnergy(loadState(username),username),username);await refreshAssetBar(username)}await loadMenu();renderAbout();window.addEventListener('languagechange',renderAbout);window.dispatchEvent(new CustomEvent('steemflags:ready'))}loadAboutPage().catch(error=>{console.error(error);window.dispatchEvent(new CustomEvent('steemflags:ready'))});</script><style>.aboutContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto}.aboutText{text-align:left}.aboutContent p{margin:12px 0;line-height:1.6}@media(max-width:560px){.aboutContent{padding:22px 16px}.aboutText{font-size:15px;line-height:1.55}}</style></body></html>
