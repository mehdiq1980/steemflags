<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="About Steem Flags">

  <title>About - Steem Flags</title>

  <link rel="stylesheet" href="css/style.css?v=20260819-09">
</head>


<body>

<div id="app"></div>


<script type="module">

async function loadAbout(){

    const app = document.getElementById("app");

    const response = await fetch(
        "./components/app-shell.html?v=20260819-10",
        {cache:"no-store"}
    );

    app.innerHTML = await response.text();


    // نمایش صفحه About داخل همان قالب اصلی
    const homeView = document.getElementById("homeView");

    if(homeView){

        homeView.hidden = false;

        homeView.innerHTML = `

        <section class="card hero">

            <p class="eyebrow">
                STEEM FLAGS
            </p>


            <h1>
                About Steem Flags
            </h1>


            <p class="muted">
                Steem Flags is a flag guessing game where players
                test their knowledge of world flags and earn SF rewards.
            </p>


            <p class="muted">
                Players answer questions, collect SF,
                and compete on the leaderboard.
            </p>


            <p class="muted">
                Developed by Mehdi Q.
            </p>


        </section>

        `;

    }


    // فعال کردن منوی همبرگری
    const menuButton=document.getElementById("menuButton");
    const menu=document.getElementById("menu");

    if(menuButton && menu){

        menuButton.onclick=()=>{

            menu.hidden=!menu.hidden;

        };

    }


}


loadAbout();

</script>


</body>

</html>
