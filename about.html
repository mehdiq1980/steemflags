<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="About Steem Flags">
  <title>About - Steem Flags</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-03">
</head>
<body>
<div id="app"></div>
<script type="module">
import { getStoredUsername } from './js/storage.js';
import { refreshLeaderboardSF } from './js/sf-balance.js?v=20260820-02';
import { loadMenu } from './js/menu.js?v=20260820-03';

async function loadAboutPage(){
    const app = document.getElementById('app');
    const response = await fetch('./components/app-shell.html?v=20260820-03', {cache:'no-store'});
    app.innerHTML = await response.text();

    // About page only needs the header/menu and SF balance.
    document.getElementById('loginView')?.remove();
    document.getElementById('homeView')?.remove();
    document.getElementById('leaderboardSection')?.remove();
    document.getElementById('gameView')?.remove();
    document.querySelector('footer')?.remove();

    const main = document.querySelector('main.appShell');
    if(main){
        main.innerHTML = `
        <section class="aboutContent">
            <img class="gameLogo logoMedium" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags logo">
            <h1>About Steem Flags</h1>
            <p>Steem Flags is a flag guessing game where players test their knowledge of world flags and earn SF rewards.</p>
            <p>Players answer questions, collect SF, and compete on the leaderboard.</p>
            <p>Developed by Mehdi Q.</p>
            <a href="./" class="primary">Back to Game</a>
        </section>`;
    }

    const assets = document.getElementById('assetStats');
    const username = getStoredUsername();
    if(assets && username){
        assets.hidden = false;
        const sf = document.getElementById('sfValue');
        if(sf) await refreshLeaderboardSF(username, sf);
    }

    // The shared menu loader owns the hamburger button and menu behavior.
    await loadMenu();
}

loadAboutPage().catch(console.error);
</script>
<style>
.aboutContent{
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    max-width:760px;
    margin:0 auto;
}
.aboutContent p{margin:12px 0;line-height:1.6}
</style>
</body>
</html>
