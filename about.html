<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="About Steem Flags">
  <title>About - Steem Flags</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-03">
  <script src="js/d2e-logo.js?v=20260825-01" defer></script>
</head>
<body>
<div id="app"></div>
<script type="module">
import { getStoredUsername, loadState, refreshDailyEnergy, syncPurchasedEnergy } from './js/storage.js?v=20260822-about-01';
import { refreshLeaderboardSF } from './js/sf-balance.js?v=20260821-01';
import { loadMenu } from './js/menu.js?v=20260820-05';
async function fetchSteemBalance(account){const body=JSON.stringify({jsonrpc:'2.0',id:1,method:'condenser_api.get_accounts',params:[[account]]});const endpoints=['https://api.steemit.com','https://api.steem.house','https://api.steemyy.com','https://api.steemworld.org'];for(const endpoint of endpoints){try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body,cache:'no-store'});if(!r.ok)continue;const p=await r.json();const b=p?.result?.[0]?.balance;if(typeof b==='string'&&/\d/.test(b))return b.replace(/\s*STEEM\s*$/i,'').trim()}catch{}}return null;}
async function loadAboutPage(){const app=document.getElementById('app');const response=await fetch('./components/app-shell.html?v=20260822-about-02',{cache:'no-store'});app.innerHTML=await response.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('footer')?.remove();const main=document.querySelector('main.appShell');if(main)main.innerHTML=`<section class="aboutContent"><img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags logo"><h1>About Steem Flags</h1><div class="aboutText"><p>Steem Flags is a Web 3.0 game based on the Steem blockchain network in the quiz and educational genres, created and developed by Mehdi Q. from Persia.</p><p>In Steem Flags, players increase their geographical knowledge by answering questions about the flags of countries around the world and earn points in a competitive environment.</p><h2>Steem Flags Economy</h2><p>In Steem Flags, players can receive non-cashable in-game tokens called D2E (Do2Earn) as rewards based on their daily energy component by participating in the game process and watching video ads (in the future). These rewards are calculated based on the player's performance, correct answers, and activity in the game.</p><p>By collecting D2E, players can compete on the leaderboard and improve their position among other players. In the future, a weekly Steem reward pool will be activated in-game, distributing between 20 and 100 $STEEM to the top 5 players on the leaderboard, based on their D2E holdings. The Steem Flags reward system is designed to incentivize further learning, active participation, and healthy competition.</p></div><a href="./" class="primary">Back to Game</a></section>`;const assets=document.getElementById('assetStats'),username=getStoredUsername();if(assets&&username){assets.hidden=false;const state=await syncPurchasedEnergy(refreshDailyEnergy(loadState(username),username),username);const energy=document.getElementById('energyValue');if(energy)energy.textContent=String(Number(state.energy)||0);const d2e=document.getElementById('sfValue');if(d2e)await refreshLeaderboardSF(username,d2e);const steem=document.getElementById('steemValue');if(steem){const balance=await fetchSteemBalance(username);if(balance!==null)steem.textContent=balance;}}await loadMenu();}
loadAboutPage().catch(console.error);
</script>
<style>.aboutContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto}.aboutText{text-align:left}.aboutContent p{margin:12px 0;line-height:1.6}</style>
</body>
</html>
