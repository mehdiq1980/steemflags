<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="About Steem Flags">
  <title>About - Steem Flags</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-03">
</head>
<body>
<div id="app"></div>
<script type="module">
import { getStoredUsername } from './js/storage.js';
import { refreshLeaderboardSF } from './js/sf-balance.js?v=20260820-02';
import { loadMenu } from './js/menu.js?v=20260820-05';

async function loadAboutPage(){
    const app = document.getElementById('app');
    const response = await fetch('./components/app-shell.html?v=20260820-03', {cache:'no-store'});
    app.innerHTML = await response.text();

    document.getElementById('loginView')?.remove();
    document.getElementById('homeView')?.remove();
    document.getElementById('leaderboardSection')?.remove();
    document.getElementById('gameView')?.remove();
    document.querySelector('footer')?.remove();

    const main = document.querySelector('main.appShell');
    if(main){
        main.innerHTML = `
        <section class="aboutContent">
            <img class="gameLogo logoMedium" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags logo">
            <h1>About Steem Flags</h1>
            <div class="aboutText">
            <p>Steem Flags is a Web 3.0 game based on the Steem blockchain network in the quiz and educational genres, created and developed by Mehdi Q. from Persia.</p>
            <p>In Steem Flags, players increase their geographical knowledge by answering questions about the flags of countries around the world and earn points in a competitive environment.</p>
            <h2>Steem Flags Economy</h2>
            <p>In Steem Flags, players can receive non-cashable in-game tokens called SF (Steem Flags) as rewards based on their daily energy component by participating in the game process and watching video ads (in the future). These rewards are calculated based on the player's performance, correct answers, and activity in the game.</p>
            <p>By collecting SF, players can compete on the leaderboard and improve their position among other players. In the future, a weekly Steem reward pool will be activated in-game, distributing between 20 and 100 $STEEM to the top 5 players on the leaderboard, based on their SF holdings. The Steem Flags reward system is designed to incentivize further learning, active participation, and healthy competition.</p>
            </div>
            <a href="./" class="primary">Back to Game</a>
        </section>`;
    }

    const assets = document.getElementById('assetStats');
    const username = getStoredUsername();
    if(assets && username){
        assets.hidden = false;
        const sf = document.getElementById('sfValue');
        if(sf) await refreshLeaderboardSF(username, sf);
    }

    await loadMenu();
}

loadAboutPage().catch(console.error);
</script>
<style>
.aboutContent{
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:28px 22px;
    max-width:760px;
    margin:0 auto;
}
.aboutText{text-align:left;}
.aboutContent p{margin:12px 0;line-height:1.6}
</style>
</body>
</html>
