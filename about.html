 en:{title:'About Steem Flags',p1:'Steem Flags is a Web 3.0 game based on the Steem blockchain network in the quiz and educational genres, created and developed by Mehdi Q. from Persia.',p2:'In Steem Flags, players increase their geographical knowledge by answering questions about the flags of countries around the world and earn points in a competitive environment.',economy:'Steem Flags Economy',p3:'In Steem Flags, players can receive non-cashable in-game tokens called D2E (Do2Earn) as rewards based on their daily energy component by participating in the game process and watching video ads (in the future). These rewards are calculated based on the player’s performance, correct answers, and activity in the game.',p4:'By collecting D2E, players can compete on the leaderboard and improve their position among other players. In the future, a weekly Steem reward pool will be activated in-game, distributing between 20 and 100 $STEEM to the top 5 players on the leaderboard, based on their D2E holdings. The Steem Flags reward system is designed to incentivize further learning, active participation, and healthy competition.',back:'Back to Game'},
 fa:{title:'درباره Steem Flags',p1:'Steem Flags یک بازی Web 3.0 بر بستر شبکه بلاک‌چین Steem در سبک‌های مسابقه‌ای و آموزشی است که توسط Mehdi Q. از سرزمین پارس ایجاد و توسعه داده شده است.',p2:'در Steem Flags، بازیکنان با پاسخ دادن به پرسش‌هایی درباره پرچم کشورهای سراسر جهان، دانش جغرافیایی خود را افزایش می‌دهند و در یک محیط رقابتی امتیاز کسب می‌کنند.',economy:'اقتصاد Steem Flags',p3:'در Steem Flags، بازیکنان می‌توانند با شرکت در فرایند بازی و در آینده با تماشای تبلیغات ویدیویی، بر اساس انرژی روزانه خود توکن درون‌بازی غیرقابل تبدیل به پول نقد به نام D2E (Do2Earn) دریافت کنند. این پاداش‌ها بر اساس عملکرد بازیکن، پاسخ‌های صحیح و فعالیت او در بازی محاسبه می‌شوند.',p4:'بازیکنان با جمع‌آوری D2E می‌توانند در لیدربورد رقابت کنند و جایگاه خود را در میان سایر بازیکنان بهبود دهند. در آینده، یک استخر پاداش هفتگی Steem در بازی فعال خواهد شد که بر اساس میزان D2E بازیکنان، بین ۲۰ تا ۱۰۰ $STEEM میان ۵ بازیکن برتر لیدربورد توزیع می‌کند. سیستم پاداش Steem Flags برای تشویق یادگیری بیشتر، مشارکت فعال و رقابت سالم طراحی شده است.',back:'بازگشت به بازی'},
 es:{title:'Acerca de Steem Flags',p1:'Steem Flags es un juego Web 3.0 basado en la red blockchain Steem, dentro de los géneros de quiz y educación, creado y desarrollado por Mehdi Q. de Persia.',p2:'En Steem Flags, los jugadores aumentan sus conocimientos geográficos respondiendo preguntas sobre las banderas de países de todo el mundo y ganan puntos en un entorno competitivo.',economy:'Economía de Steem Flags',p3:'En Steem Flags, los jugadores pueden recibir tokens no canjeables por dinero llamados D2E (Do2Earn) como recompensas según su energía diaria, participando en el juego y viendo anuncios de vídeo en el futuro. Las recompensas se calculan según el rendimiento, las respuestas correctas y la actividad del jugador.',p4:'Al acumular D2E, los jugadores pueden competir en la clasificación y mejorar su posición. En el futuro, se activará un fondo semanal de recompensas Steem que distribuirá entre 20 y 100 $STEEM a los 5 mejores jugadores según sus D2E. El sistema de recompensas está diseñado para fomentar el aprendizaje, la participación activa y la competencia sana.',back:'Volver al juego'},
 ur:{title:'Steem Flags کے بارے میں',p1:'Steem Flags ایک Web 3.0 گیم ہے جو Steem بلاک چین نیٹ ورک پر مبنی ہے اور کوئز اور تعلیمی انواع میں شامل ہے۔ اسے فارس سے تعلق رکھنے والے Mehdi Q. نے تخلیق اور تیار کیا ہے۔',p2:'Steem Flags میں کھلاڑی دنیا بھر کے ممالک کے جھنڈوں سے متعلق سوالات کے جواب دے کر اپنی جغرافیائی معلومات میں اضافہ کرتے ہیں اور مسابقتی ماحول میں پوائنٹس کماتے ہیں۔',economy:'Steem Flags کی معیشت',p3:'Steem Flags میں کھلاڑی گیم میں شرکت اور مستقبل میں ویڈیو اشتہارات دیکھنے کے ذریعے اپنی روزانہ کی توانائی کی بنیاد پر D2E (Do2Earn) نامی غیر نقدی درونِ گیم ٹوکن بطور انعام حاصل کر سکتے ہیں۔',p4:'D2E جمع کر کے کھلاڑی لیڈر بورڈ میں مقابلہ کر سکتے ہیں اور اپنی پوزیشن بہتر بنا سکتے ہیں۔ مستقبل میں ہفتہ وار Steem ریوارڈ پول فعال کیا جائے گا۔',back:'گیم پر واپس جائیں'},
 hi:{title:'Steem Flags के बारे में',p1:'Steem Flags एक Web 3.0 गेम है जो Steem ब्लॉकचेन नेटवर्क पर आधारित है और क्विज़ तथा शैक्षिक श्रेणियों में आता है। इसे Mehdi Q. ने बनाया और विकसित किया है।',p2:'खिलाड़ी दुनिया भर के देशों के झंडों से जुड़े प्रश्नों के उत्तर देकर अपना भौगोलिक ज्ञान बढ़ाते हैं और प्रतिस्पर्धी वातावरण में अंक अर्जित करते हैं।',economy:'Steem Flags अर्थव्यवस्था',p3:'खिलाड़ी गेम में भाग लेकर और भविष्य में वीडियो विज्ञापन देखकर अपनी दैनिक ऊर्जा के आधार पर D2E (Do2Earn) नामक गैर-नकदी इन-गेम टोकन पुरस्कार के रूप में प्राप्त कर सकते हैं।',p4:'D2E जमा करके खिलाड़ी लीडरबोर्ड पर प्रतिस्पर्धा कर सकते हैं और अपनी स्थिति बेहतर कर सकते हैं।',back:'गेम पर वापस जाएँ'},
 bn:{title:'Steem Flags সম্পর্কে',p1:'Steem Flags একটি Web 3.0 গেম, যা Steem ব্লকচেইন নেটওয়ার্কের উপর ভিত্তি করে তৈরি এবং কুইজ ও শিক্ষামূলক ঘরানার অন্তর্ভুক্ত। এটি Mehdi Q. তৈরি ও উন্নয়ন করেছেন।',p2:'খেলোয়াড়রা বিশ্বের বিভিন্ন দেশের পতাকা সম্পর্কে প্রশ্নের উত্তর দিয়ে তাদের ভৌগোলিক জ্ঞান বাড়ায় এবং প্রতিযোগিতামূলক পরিবেশে পয়েন্ট অর্জন করে।',economy:'Steem Flags অর্থনীতি',p3:'খেলোয়াড়রা গেমে অংশগ্রহণ করে এবং ভবিষ্যতে ভিডিও বিজ্ঞাপন দেখে দৈনিক শক্তির ভিত্তিতে D2E (Do2Earn) নামের নন-ক্যাশেবল ইন-গেম টোকেন পুরস্কার পেতে পারে।',p4:'D2E সংগ্রহ করে খেলোয়াড়রা লিডারবোর্ডে প্রতিযোগিতা করতে এবং নিজেদের অবস্থান উন্নত করতে পারে।',back:'গেমে ফিরে যান'},
 zh:{title:'关于 Steem Flags',p1:'Steem Flags 是一款基于 Steem 区块链网络的 Web 3.0 问答教育类游戏，由 Mehdi Q. 创建和开发。',p2:'玩家通过回答世界各国国旗相关问题来提高地理知识，并在竞争环境中获得积分。',economy:'Steem Flags 经济系统',p3:'玩家可以通过参与游戏，并在未来观看视频广告，根据每日能量获得 D2E (Do2Earn) 不可兑换现金的游戏内代币奖励。',p4:'玩家收集 D2E 后可以在排行榜上竞争并提升排名。未来游戏将启用每周 Steem 奖励池。',back:'返回游戏'},
 ko:{title:'Steem Flags 소개',p1:'Steem Flags는 Steem 블록체인 네트워크를 기반으로 한 Web 3.0 퀴즈 및 교육 게임으로 Mehdi Q.가 만들고 개발했습니다.',p2:'플레이어는 전 세계 국가의 국기에 관한 질문에 답하며 지리 지식을 높이고 경쟁 환경에서 포인트를 얻습니다.',economy:'Steem Flags 경제',p3:'플레이어는 게임에 참여하고 향후 동영상 광고를 시청하여 일일 에너지에 따라 D2E (Do2Earn) 현금화할 수 없는 게임 내 토큰을 보상으로 받을 수 있습니다.',p4:'D2E를 모아 리더보드에서 경쟁하고 순위를 높일 수 있습니다. 향후 주간 Steem 보상 풀이 활성화됩니다.',back:'게임으로 돌아가기'}

async function init(){
  const menu=await loadMenu();
  const assetBar=await loadSharedAssetBar();
  render();
  refreshAssetBar();
}
function render(){
  const lang=getLanguage();
  const t=T[lang]||T.en;
  const rtl=lang==='fa'||lang==='ur';
  document.documentElement.lang=lang;
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.title=t.title+' - Steem Flags';
  document.getElementById('app').innerHTML=`<main class="page-card about-page"><h1>${t.title}</h1><p>${t.p1}</p><p>${t.p2}</p><h2>${t.economy}</h2><p>${t.p3}</p><p>${t.p4}</p><a class="btn" href="./index.html">${t.back}</a></main>`;
}
window.addEventListener('languagechange',render);
init();
