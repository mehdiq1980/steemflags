<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Sponsor Advertisement</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.ad{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827,#020617)}.adBox{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.adText{font-size:clamp(24px,5vw,56px);font-weight:800;opacity:.9}.timer{position:fixed;top:12px;left:12px;z-index:10;min-width:82px;padding:8px 12px;border-radius:9px;background:#000;color:#fff;border:2px solid #fff;font-size:22px;font-weight:900;text-align:center}.close{position:fixed;top:12px;right:12px;z-index:20;width:52px;height:52px;border:2px solid #111;border-radius:50%;background:#fff;color:#111;font-size:34px;font-weight:900;line-height:46px;text-align:center;cursor:pointer}.close[hidden]{display:none!important}.close:active{transform:scale(.95)}.status{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:14px;text-align:center;opacity:.8}</style>
</head>
<body><div class="ad"><div id="timer" class="timer">01:00</div><button id="closeButton" class="close" type="button" aria-label="Close advertisement" hidden>×</button><div class="adBox"><div class="adText">Sponsor Advertisement<br><small>Watch for 60 seconds • Earn +2 D2E</small></div></div><div id="status" class="status"></div></div>
<script>(function(){const API_BASE='https://steemflags.mehdiq.workers.dev',timer=document.getElementById('timer'),closeButton=document.getElementById('closeButton'),status=document.getElementById('status');const username=new URLSearchParams(location.search).get('username')||'';let remaining=60,finished=false;function render(){const m=Math.floor(remaining/60),s=remaining%60;timer.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(remaining<=0){timer.textContent='00:00';closeButton.hidden=false;clearInterval(interval)}}async function finish(){if(finished)return;finished=true;closeButton.disabled=true;status.textContent='Adding +2 D2E…';try{const eventId='ad-'+username+'-'+Date.now()+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));const r=await fetch(API_BASE+'/api/ad/reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,eventId}),cache:'no-store'});const d=await r.json();if(!r.ok||!d?.success)throw Error(d?.error||'Unable to add reward');window.location.replace('./index.html?sponsorReward=2')}catch(e){finished=false;closeButton.disabled=false;status.textContent=e.message||'Unable to add reward.'}}closeButton.addEventListener('click',finish);render();const interval=setInterval(function(){remaining--;render()},1000)})();</script>
</body>
</html>
