ument.documentElement.dir=['fa','ur'].includes(l)?'rtl':'ltr';document.title=t.sponsorTitle;const API_BASE='https://steemflags.mehdiq.workers.dev',timer=document.getElementById('timer'),closeButton=document.getElementById('closeButton'),status=document.getElementById('status'),SESSION_KEY='steemFlagsAuthSession',CONTEXT_KEY='steemFlagsSponsorContext';let sessionId='',finished=false,interval=null;function getUsername(){try{return String(JSON.parse(localStorage.getItem(SESSION_KEY)||'null')?.username||'').trim().toLowerCase()}catch{return ''}}function render(n){n=Math.max(0,Math.ceil(n));timer.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n<=0){closeButton.hidden=false;if(interval)clearInterval(interval)}}function fail(m){status.textContent=m;timer.textContent='--:--'}const username=getUsername();try{if(!username)throw Error(t.adError);const r=await fetch(API_BASE+'/api/ad/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username}),cache:'no-store'}),d=await r.json();if(!r.ok||!d?.success||!d.sessionId)throw Error(d?.error||t.adError);sessionId=d.sessionId;const started=Date.now(),tick=()=>render(Math.max(0,60000-(Date.now()-started))/1000);tick();interval=setInterval(tick,250)}catch(e){fail(e.message||t.adError);return}async function finish(){if(finished)return;finished=true;closeButton.disabled=true;status.textContent=t.adReward;try{const eventId='ad-'+username+'-'+Date.now()+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)),r=await fetch(API_BASE+'/api/ad/reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,sessionId,eventId}),cache:'no-store'}),d=await r.json();if(!r.ok||!d?.success)throw Error(d?.error||t.adError);const context=sessionStorage.getItem(CONTEXT_KEY)||'game';if(context==='earn'){sessionStorage.setItem('steemFlagsSponsorReward','2');sessionStorage.removeItem(CONTEXT_KEY);location.replace('./earnd2e.
