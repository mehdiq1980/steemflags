<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="Earn more SF in Steem Flags.">
  <meta name="application-name" content="Steem Flags">
  <title>Earn more SF</title>
  <link rel="stylesheet" href="css/style.css?v=20260817-20">
</head>
<body>
  <header class="topbar">
    <button class="iconButton" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    <a class="brand" href="./" aria-label="Steem Flags home"><img class="gameLogo logoSmall" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags"></a>
    <div class="assetBar" id="assetBar" aria-label="Assets">
      <span class="assetItem" title="Energy">⚡ <strong id="energyBalance">—</strong></span>
      <a class="assetItem sfAsset" href="./earnsf.html" title="Earn more SF">SF <strong id="sfBalance">—</strong><span class="sfPlus" aria-hidden="true">+</span></a>
      <span class="assetItem" title="STEEM"><img src="https://i.ibb.co/20K1tHyK/icon-circlesteem-gradient.png" alt="STEEM"> <strong id="steemBalance">—</strong></span>
    </div>
  </header>

  <aside class="sideMenu" id="sideMenu" aria-hidden="true">
    <div class="sideMenuHeader">
      <img class="gameLogo logoSmall" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags">
      <button class="iconButton" id="closeMenu" type="button" aria-label="Close menu">×</button>
    </div>
    <nav class="menuNav">
      <a href="./">🏠 Home</a>
      <a href="./earnsf.html">💰 Earn more SF</a>
      <button type="button" id="languageMenu">🌐 Language</button>
      <button type="button" id="newGameMenu">🎮 New Game</button>
      <button type="button" id="logoutMenu">↪ Logout</button>
    </nav>
  </aside>
  <div class="menuBackdrop" id="menuBackdrop" hidden></div>

  <main class="appShell">
    <section class="card hero">
      <img class="gameLogo logoMedium" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags logo">
      <h1>Earn more SF</h1>
      <p class="muted">Complete games and answer flags correctly to earn SF.</p>
      <a class="primary" href="./">Play Steem Flags</a>
    </section>
  </main>
  <footer><span>Developed by</span> <a href="https://allmylinks.com/mehdiq1980" target="_blank" rel="noopener noreferrer">Mehdi Q.</a></footer>

  <script>
    const menuButton = document.getElementById('menuButton');
    const closeMenu = document.getElementById('closeMenu');
    const sideMenu = document.getElementById('sideMenu');
    const backdrop = document.getElementById('menuBackdrop');
    function setMenu(open) {
      sideMenu.classList.toggle('open', open);
      sideMenu.setAttribute('aria-hidden', String(!open));
      menuButton.setAttribute('aria-expanded', String(open));
      backdrop.hidden = !open;
    }
    menuButton.addEventListener('click', () => setMenu(true));
    closeMenu.addEventListener('click', () => setMenu(false));
    backdrop.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

    const username = localStorage.getItem('steemFlagsUsername') || localStorage.getItem('steemUsername') || '';
    const pointsKey = username ? 'steemFlagsTotalPoints_' + username : '';
    const totalPoints = pointsKey ? (parseInt(localStorage.getItem(pointsKey) || '0', 10) || 0) : 0;
    document.getElementById('sfBalance').textContent = totalPoints;

    const energy = localStorage.getItem('steemFlagsEnergy_' + username);
    if (energy !== null) document.getElementById('energyBalance').textContent = energy;
    const steem = localStorage.getItem('steemFlagsSteem_' + username);
    if (steem !== null) document.getElementById('steemBalance').textContent = steem;

    document.getElementById('logoutMenu').addEventListener('click', () => {
      ['steemFlagsUsername','steemUsername'].forEach(k => localStorage.removeItem(k));
      location.href = './';
    });
    document.getElementById('newGameMenu').addEventListener('click', () => location.href = './');
  </script>
</body>
</html>
