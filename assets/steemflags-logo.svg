th="10" stroke-linecap="round"/></g><g filter="url(#shadow)"><text x="300" y="420" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="106" font-weight="900" font-style="italic" fill="url(#silver)" stroke="#063da8" stroke-width="18" paint-order="stroke">STEEM</text><path d="M105 456 Q300 415 495 456 L470 525 Q300 490 130 525 Z" fill="url(#blue)" stroke="url(#gold)" stroke-width="10"/><text x="300" y="498" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="54" font-weight="900" letter-spacing="9" fill="#ffd447" stroke="#7d4500" stroke-width="3" paint-order="stroke">FLAGS</text><text x="145" y="493" font-size="35" fill="#ffd447">★</text><text x="455" y="493" font-size="35" fill="#ffd447">★</text></g></svg>