<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Steem Flags Shop</title><link rel="stylesheet" href="css/style.css?v=20260820-03"></head>
<body><div id="app"></div>
<script type="module">
import {getStoredUsername,loadState,refreshDailyEnergy} from './js/storage.js';
import {loadMenu} from './js/menu.js?v=20260820-05';
const GITHUB_ISSUE_URL='https://github.com/mehdiq1980/steemflags/issues/new';
async function loadShopPage(){
 const app=document.getElementById('app');const r=await fetch('./components/app-shell.html?v=20260822-shop-issue2',{cache:'no-store'});app.innerHTML=await r.text();
 ['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('footer')?.remove();
 const main=document.querySelector('main.appShell');if(main)main.innerHTML=`<section class="shopContent"><img class="gameLogo logoMedium" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags logo"><h1>Steem Flags Shop</h1><div class="shopCard"><h2>Energy</h2><p class="shopDescription">Buy 1 extra energy for 10 D2E.</p><div class="shopStats"><div><span>Current Energy</span><strong id="shopEnergy">3</strong></div><div><span>Total D2E</span><strong id="shopD2E">—</strong></div><div><span>Daily Limit</span><strong>10</strong></div></div><button id="buyEnergyButton" class="primary" type="button">Buy 1 Energy — 10 D2E</button><p id="shopMessage" class="shopMessage" role="status"></p></div><a href="./" class="primary">Back to Game</a></section>`;
 const username=getStoredUsername();const assets=document.getElementById('assetStats');if(assets&&username)assets.hidden=false;setupShop(username);await loadMenu();
}
async function setupShop(username){
 const e=document.getElementById('shopEnergy'),d=document.getElementById('shopD2E'),b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage');if(!e||!d||!b||!m)return;
 if(!username){d.textContent='0';b.disabled=true;m.textContent='Log in to buy energy.';return;}
 const state=refreshDailyEnergy(loadState(username),username);e.textContent=String(Math.max(0,Number(state.energy)||0));
 try{const r=await fetch('./data/leaderboard.json?v='+Date.now(),{cache:'no-store'});const data=await r.json();d.textContent=String(Number(data?.players?.[username.toLowerCase()]?.sf)||0);}catch{d.textContent='—';}
 b.addEventListener('click',()=>{
   const eventId=`${username}-${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(16).slice(2)}`;
   const title=`[SHOP-EVENT] ${username} Buy 1 Energy - 10 D2E`;
   const body=['[SHOP-EVENT]',`event_id: ${eventId}`,`username: ${username}`,'type: energy_purchase','energy: 1','d2e_delta: -10',`created_at: ${new Date().toISOString()}`].join('\n');
   window.open(`${GITHUB_ISSUE_URL}?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,'_blank','noopener,noreferrer');
   window.location.replace('./');
 });
 m.textContent='Click Buy to open the simple reward-style Issue form in a new tab.';
}
loadShopPage().catch(console.error);
</script>
<style>.shopContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto;text-align:center}.shopContent h1{margin:16px 0 24px}.shopCard{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin:0 auto 24px;max-width:620px}.shopDescription{opacity:.85}.shopStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.shopStats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06)}.shopStats span{display:block;font-size:.8rem;opacity:.75;margin-bottom:5px}.shopStats strong{font-size:1.2rem}.shopCard button{width:100%;max-width:420px}.shopMessage{min-height:1.4em;margin:14px 0 0;opacity:.85}@media(max-width:520px){.shopStats{grid-template-columns:1fr}.shopContent{padding:24px 16px}}</style>
</body></html>
