<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Steem Flags Shop</title><link rel="stylesheet" href="css/style.css?v=20260820-03"><link rel="stylesheet" href="css/preloader.css?v=20260826-01"><script src="js/preloader.js?v=20260826-01" defer></script><script src="js/d2e-logo.js?v=20260825-02" defer></script></head><body><div id="app"></div><script type="module">
import{getStoredUsername}from'./js/storage.js';import{loadMenu}from'./js/menu.js?v=20260820-05';import{loadAssetBar as loadSharedAssetBar,refreshAssetBar}from'./js/asset-bar.js?v=20260826-assetbar-06';
const API_BASE='https://steemflags.mehdiq.workers.dev';const ENERGY_PRICE=10;const DAILY_LIMIT=10;
async function loadShopPage(){const app=document.getElementById('app');const r=await fetch('./components/app-shell.html?v=20260826-shop-06',{cache:'no-store'});app.innerHTML=await r.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('footer')?.remove();const main=document.querySelector('main.appShell');if(main)main.innerHTML=`<section class="shopContent"><img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags logo"><h1>Steem Flags Shop</h1><div class="shopCard"><h2>⚡ Energy</h2><p class="shopDescription">Buy 1 extra energy for <strong>${ENERGY_PRICE} D2E</strong>.</p><div class="shopStats"><div><span>Current Energy</span><strong id="shopEnergy">—</strong></div><div><span>Available D2E</span><strong id="shopD2E">—</strong></div><div><span>Purchases Left Today</span><strong id="shopLimit">—</strong></div></div><button id="buyEnergyButton" class="primary" type="button">Buy 1 Energy — ${ENERGY_PRICE} D2E</button><p id="shopMessage" class="shopMessage" role="status" aria-live="polite"></p></div><a href="./" class="primary">Back to Game</a></section>`;const username=getStoredUsername();await loadSharedAssetBar();await refreshShop(username);await loadMenu();window.dispatchEvent(new CustomEvent('steemflags:ready'))}
async function getPurchaseStatus(username){const r=await fetch(`${API_BASE}/api/shop/energy?username=${encodeURIComponent(username)}`,{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('SHOP_STATUS_'+r.status);return r.json()}
async function refreshShop(username){const e=document.getElementById('shopEnergy'),d=document.getElementById('shopD2E'),b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage'),l=document.getElementById('shopLimit');if(!e||!d||!b||!m)return;if(!username){e.textContent='—';d.textContent='—';l.textContent='—';b.disabled=true;m.textContent='Log in to buy energy.';return}const account=await refreshAssetBar(username);if(!account){e.textContent='—';d.textContent='—';l.textContent='—';b.disabled=true;m.textContent='Unable to validate your account balance. Please try again.';return}const energy=Math.max(0,Math.floor(Number(account.Energy)||0));const d2e=Math.max(0,Math.floor(Number(account.D2E)||0));e.textContent=String(energy);d.textContent=String(d2e);let purchasedToday=0;try{const status=await getPurchaseStatus(username);purchasedToday=Math.max(0,Number(status?.purchasedToday)||0)}catch(error){console.warn(error)}const remaining=Math.max(0,DAILY_LIMIT-purchasedToday);l.textContent=String(remaining);b.disabled=d2e<ENERGY_PRICE||remaining<=0;if(d2e<ENERGY_PRICE)m.textContent=`Insufficient D2E. You need ${ENERGY_PRICE} D2E.`;else if(remaining<=0)m.textContent='Daily energy purchase limit reached.';else m.textContent=`${remaining} purchase${remaining===1?'':'s'} remaining today.`;b.onclick=()=>buyEnergy(username)}
async function buyEnergy(username){const b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage');if(!b||b.disabled)return;b.disabled=true;m.textContent='Processing purchase securely in D1…';try{const r=await fetch(`${API_BASE}/api/shop/energy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.success){b.disabled=false;m.textContent=data.error==='Insufficient D2E'?`Insufficient D2E. You need ${ENERGY_PRICE} D2E.`:data.error==='Daily energy purchase limit reached'?'Daily energy purchase limit reached.':'Purchase could not be completed. Please try again.';return}const account=data.account||{};document.getElementById('shopEnergy').textContent=String(Math.max(0,Math.floor(Number(account.Energy)||0)));document.getElementById('shopD2E').textContent=String(Math.max(0,Math.floor(Number(account.D2E)||0)));document.getElementById('shopLimit').textContent=String(Math.max(0,DAILY_LIMIT-(Number(data.purchasedToday)||0)));await refreshAssetBar(username);m.textContent='Purchase successful: +1 Energy and -10 D2E.';if(Number(data.purchasedToday)>=DAILY_LIMIT)b.disabled=true}catch(error){console.error(error);b.disabled=false;m.textContent='Network error. Your balance was not changed.'}}
loadShopPage().catch(error=>{console.error(error);window.dispatchEvent(new CustomEvent('steemflags:ready'))});</script><style>.shopContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto;text-align:center}.shopContent h1{margin:16px 0 24px}.shopCard{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin:0 auto 24px;max-width:620px}.shopDescription{opacity:.85}.shopStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.shopStats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06)}.shopStats span{display:block;font-size:.8rem;opacity:.75;margin-bottom:5px}.shopStats strong{font-size:1.2rem}.shopCard button{width:100%;max-width:420px}.shopMessage{min-height:1.4em;margin:14px 0 0;opacity:.85}@media(max-width:520px){.shopStats{grid-template-columns:1fr}.shopContent{padding:24px 16px}}</style></body></html>
