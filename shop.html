<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="Steem Flags Shop">
  <title>Steem Flags Shop</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-03">
</head>
<body>
<div id="app"></div>
<script type="module">
import { getStoredUsername } from './js/storage.js';
import { refreshLeaderboardSF } from './js/sf-balance.js?v=20260821-01';
import { loadMenu } from './js/menu.js?v=20260820-05';

async function loadShopPage(){
    const app = document.getElementById('app');
    const response = await fetch('./components/app-shell.html?v=20260821-01', {cache:'no-store'});
    app.innerHTML = await response.text();

    document.getElementById('loginView')?.remove();
    document.getElementById('homeView')?.remove();
    document.getElementById('leaderboardSection')?.remove();
    document.getElementById('gameView')?.remove();
    document.querySelector('footer')?.remove();

    const main = document.querySelector('main.appShell');
    if(main){
        main.innerHTML = `<section class="shopContent"></section>`;
    }

    const assets = document.getElementById('assetStats');
    const username = getStoredUsername();
    if(assets && username){
        assets.hidden = false;
        const d2e = document.getElementById('sfValue');
        if(d2e) await refreshLeaderboardSF(username, d2e);
    }

    await loadMenu();
}

loadShopPage().catch(console.error);
</script>
<style>
.shopContent{
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:28px 22px;
    max-width:760px;
    min-height:120px;
    margin:0 auto;
}
</style>
</body>
</html>
