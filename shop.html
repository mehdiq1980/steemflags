<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="Steem Flags Shop">
  <title>Steem Flags Shop</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-03">
</head>
<body>
<div id="app"></div>
<script type="module">
import { getStoredUsername, loadState, saveState, refreshDailyEnergy } from './js/storage.js';
import { loadMenu } from './js/menu.js?v=20260820-05';

const API_BASE = 'https://steemflags.mehdiq.workers.dev';
const ENERGY_PRICE = 10;
const DAILY_PURCHASE_LIMIT = 10;

async function api(path, options = {}) {
    const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        cache: 'no-store'
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.success === false) throw new Error(data.error || `Request failed: ${response.status}`);
    return data;
}

async function loadShopPage(){
    const app = document.getElementById('app');
    const response = await fetch('./components/app-shell.html?v=20260822-shop', {cache:'no-store'});
    app.innerHTML = await response.text();

    document.getElementById('loginView')?.remove();
    document.getElementById('homeView')?.remove();
    document.getElementById('leaderboardSection')?.remove();
    document.getElementById('gameView')?.remove();
    document.querySelector('footer')?.remove();

    const main = document.querySelector('main.appShell');
    if(main){
        main.innerHTML = `
        <section class="shopContent">
            <img class="gameLogo logoMedium" src="https://i.ibb.co/Fq0L0xWk/steemflags-logo.png" alt="Steem Flags logo">
            <h1>Steem Flags Shop</h1>
            <div class="shopCard">
                <h2>Energy</h2>
                <p class="shopDescription">Buy extra energy with D2E and keep playing.</p>
                <div class="shopStats">
                    <div><span>Current Energy</span><strong id="shopEnergy">3</strong></div>
                    <div><span>Total D2E</span><strong id="shopD2E">—</strong></div>
                    <div><span>Purchased Today</span><strong id="shopPurchased">0 / 10</strong></div>
                </div>
                <div class="shopPrice">1 Energy = <strong>10 D2E</strong></div>
                <button id="buyEnergyButton" class="primary" type="button">Buy 1 Energy — 10 D2E</button>
                <p id="shopMessage" class="shopMessage" role="status" aria-live="polite"></p>
            </div>
            <a href="./" class="primary">Back to Game</a>
        </section>`;
    }

    const username = getStoredUsername();
    const assets = document.getElementById('assetStats');
    if(assets && username) assets.hidden = false;
    setupShop(username);
    await loadMenu();
}

async function setupShop(username){
    const energyEl = document.getElementById('shopEnergy');
    const d2eEl = document.getElementById('shopD2E');
    const purchasedEl = document.getElementById('shopPurchased');
    const button = document.getElementById('buyEnergyButton');
    const message = document.getElementById('shopMessage');
    if(!energyEl || !d2eEl || !purchasedEl || !button || !message) return;

    if(!username){
        d2eEl.textContent = '0';
        purchasedEl.textContent = '0 / 10';
        button.disabled = true;
        message.textContent = 'Log in to buy energy.';
        return;
    }

    let state = refreshDailyEnergy(loadState(username), username);
    let d2e = 0;
    let purchased = 0;

    function render(){
        state = refreshDailyEnergy(loadState(username), username);
        energyEl.textContent = String(Math.max(0, Number(state.energy) || 0));
        d2eEl.textContent = String(d2e);
        purchasedEl.textContent = `${purchased} / ${DAILY_PURCHASE_LIMIT}`;
        button.disabled = purchased >= DAILY_PURCHASE_LIMIT || d2e < ENERGY_PRICE;
        if(purchased >= DAILY_PURCHASE_LIMIT) message.textContent = 'Daily purchase limit reached.';
        else if(d2e < ENERGY_PRICE) message.textContent = 'You need 10 D2E to buy 1 energy.';
        else message.textContent = '';
    }

    async function refreshBalance(){
        const result = await api(`/api/shop/balance?username=${encodeURIComponent(username)}`);
        d2e = Number(result.d2e) || 0;
        render();
    }

    button.addEventListener('click', async () => {
        if(button.disabled) return;
        button.disabled = true;
        message.textContent = 'Processing purchase…';
        try {
            const result = await api('/api/shop/buy-energy', {
                method: 'POST',
                body: JSON.stringify({ username })
            });
            d2e = Number(result.d2e) || 0;
            purchased = Number(result.purchasedToday) || (purchased + 1);
            state = refreshDailyEnergy(loadState(username), username);
            state.energy = (Number(state.energy) || 0) + 1;
            saveState(state, username);
            message.textContent = '1 energy purchased successfully.';
            render();
        } catch(error) {
            message.textContent = error.message || 'Purchase failed.';
            await refreshBalance().catch(() => render());
        }
    });

    try {
        const balance = await api(`/api/shop/balance?username=${encodeURIComponent(username)}`);
        d2e = Number(balance.d2e) || 0;
        purchased = 0;
        render();
    } catch(error) {
        d2eEl.textContent = '—';
        button.disabled = true;
        message.textContent = 'Unable to load the D2E balance.';
    }
}

loadShopPage().catch(console.error);
</script>
<style>
.shopContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto;text-align:center}
.shopContent h1{margin:16px 0 24px}.shopCard{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin:0 auto 24px;max-width:620px}.shopCard h2{margin:0 0 8px}.shopDescription{margin:0 0 20px;opacity:.85}.shopStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.shopStats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06)}.shopStats span{display:block;font-size:.8rem;opacity:.75;margin-bottom:5px}.shopStats strong{font-size:1.25rem}.shopPrice{margin:18px 0;font-size:1.05rem}.shopCard button{width:100%;max-width:420px}.shopMessage{min-height:1.4em;margin:14px 0 0;opacity:.85}@media(max-width:520px){.shopStats{grid-template-columns:1fr}.shopContent{padding:24px 16px}}
</style>
</body>
</html>
