<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Earn more D2E</title><link rel="stylesheet" href="css/style.css?v=20260820-03"><link rel="stylesheet" href="css/preloader.css?v=20260826-01"><script src="js/preloader.js?v=20260826-01" defer></script><script src="js/d2e-logo.js?v=20260825-02" defer></script></head><body><div id="app"></div><script type="module">import{loadMenu}from'./js/menu.js?v=20260826-menu-position-04';import{loadAssetBar as loadSharedAssetBar,refreshAssetBar}from'./js/asset-bar.js?v=20260826-assetbar-08';import{applyLanguage,getLanguage,setLanguage}from'./js/i18n.js';import{getStoredUsername}from'./js/storage.js';async function loadEarnPage(){const app=document.getElementById('app'),r=await fetch('./components/app-shell.html?v=20260826-earnd2e-06',{cache:'no-store'});if(!r.ok)throw Error(`APP_SHELL_${r.status}`);app.innerHTML=await r.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('footer')?.remove();const main=document.querySelector('main.appShell');if(main)main.innerHTML=`<section class="card hero earnD2EPage"><div class="d2eLogoWrap"><img class="d2eLogo" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/main/assets/d2e_asset_logo1.png?v=20260828" alt="D2E logo"></div><h1>Earn more D2E</h1><p class="muted">Choose a way to earn more D2E.</p><div class="earnOptions"><a class="earnOption disabled" href="./video-ad.html" aria-label="Watch Video Ads & Earn D2E" aria-disabled="true" tabindex="-1"><img src="assets/watch-video-ads-earn-sf.png?v=20260818" alt="Watch Video Ads & Earn D2E"></a><a class="earnOption" href="./" aria-label="Play Steem Flags & Earn D2E"><img src="assets/play-steem-flags-earn-sf.png?v=20260818" alt="Play Steem Flags & Earn D2E"></a></div></section>`;await loadSharedAssetBar();const username=getStoredUsername();if(username)await refreshAssetBar(username);await loadMenu();applyLanguage(document,getLanguage());const language=document.getElementById('languageSelect');if(language){language.value=getLanguage();language.addEventListener('change',e=>{setLanguage(e.target.value);applyLanguage(document,e.target.value)})}window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:true}}))}loadEarnPage().catch(error=>{console.error('Earn D2E startup failed',error);const app=document.getElementById('app');if(app)app.innerHTML='<main class="appShell"><section class="card hero"><h1>Earn more D2E</h1><p>Unable to load this page. Please refresh.</p></section></main>';window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:false,error}}))});</script><style>.earnD2EPage{text-align:center}.d2eLogoWrap{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto 18px}.d2eLogo{display:block;width:140px;height:140px;max-width:140px;max-height:140px;object-fit:contain}.earnOptions{display:flex;flex-direction:column;gap:14px;width:100%;max-width:1080px;margin:24px auto 0}.earnOption{display:block;width:100%;padding:0!important;margin:0!important;background:none!important;border:0!important;text-decoration:none!important;line-height:0!important}.earnOption img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.earnOption.disabled{pointer-events:none!important;cursor:default!important}.earnOption.disabled img{filter:grayscale(100%)!important;opacity:.6!important}</style></body></html>
