<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Video Advertisement</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.ad{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827,#020617)}.adBox{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.adText{font-size:clamp(24px,5vw,56px);font-weight:800;opacity:.9}.timer{position:fixed;top:12px;left:12px;z-index:10;min-width:82px;padding:8px 12px;border-radius:9px;background:#000;color:#fff;border:2px solid #fff;font-size:22px;font-weight:900;text-align:center}.close{position:fixed;top:12px;right:12px;z-index:20;width:52px;height:52px;border:2px solid #111;border-radius:50%;background:#fff;color:#111;font-size:34px;font-weight:900;line-height:46px;text-align:center;cursor:pointer}.close[hidden]{display:none!important}.close:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="ad">
<div id="timer" class="timer">01:00</div>
<button id="closeButton" class="close" type="button" aria-label="Close advertisement" hidden>×</button>
<div class="adBox"><div class="adText">Video Advertisement<br><small>Reward Video • Earn D2E</small></div></div>
</div>
<script>
(function(){
  const timer=document.getElementById('timer');
  const closeButton=document.getElementById('closeButton');
  let remaining=60;
  function render(){
    const minutes=Math.floor(remaining/60);
    const seconds=remaining%60;
    timer.textContent=String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0');
    if(remaining<=0){
      timer.textContent='00:00';
      closeButton.hidden=false;
      clearInterval(interval);
    }
  }
  closeButton.addEventListener('click',function(){window.location.replace('./earnsf.html');});
  render();
  const interval=setInterval(function(){remaining--;render();},1000);
})();
</script>
</body>
</html>
