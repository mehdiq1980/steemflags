<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weekly $STEEM Rewards Pool</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #080d1a;
      color: #f5f7fb;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reward-card {
      width: min(100%, 520px);
      padding: 28px 26px;
      border: 1.5px solid rgba(255,255,255,.22);
      border-radius: 26px;
      background: linear-gradient(145deg, #111c31, #0b1324);
      box-shadow: 0 18px 55px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(21px, 5vw, 28px);
      line-height: 1.25;
      font-weight: 800;
    }
    .item {
      margin: 12px 0;
      font-size: clamp(16px, 4vw, 19px);
      line-height: 1.5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="reward-card" aria-label="Weekly STEEM Rewards Pool">
    <h1>💰 Weekly $STEEM Rewards Pool</h1>
    <div class="item">✅ Amount: 20 ~ 100 $STEEM</div>
    <div class="item">✅ Distributed to the top 5 gamers on the leaderboard</div>
  </main>
</body>
</html>
