<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="Steem Flags — Guess the flags and earn D2E.">
  <meta name="application-name" content="Steem Flags">
  <meta name="robots" content="index,follow">
  <title>Steem Flags</title>
  <link rel="stylesheet" href="css/style.css?v=20260820-01">
  <link rel="stylesheet" href="css/preloader.css?v=20260825-11">
  <script src="js/preloader.js?v=20260825-11" defer></script>
</head>
<body>
  <div id="sf-preloader" role="status" aria-label="Loading Steem Flags">
    <div class="sf-loader-inner">
      <div class="sf-loader-logo" aria-hidden="true">
        <img class="sf-loader-logo-base" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags official logo" decoding="async">
        <canvas class="sf-loader-flag-wave" aria-hidden="true"></canvas>
      </div>
      <svg class="sf-loader-ring" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="sfRingGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#005cff"/>
            <stop offset="65%" stop-color="#087cff"/>
            <stop offset="100%" stop-color="#72c8ff"/>
          </linearGradient>
        </defs>
        <circle class="sf-loader-ring-track" cx="50" cy="50" r="46" pathLength="100"></circle>
        <circle class="sf-loader-ring-progress" cx="50" cy="50" r="46" pathLength="100"></circle>
      </svg>
      <div class="sf-loader-status">
        <p class="sf-loader-title">Loading...</p>
      </div>
    </div>
  </div>

  <div id="app" aria-live="polite"><main class="appShell"><section class="card hero"><p class="eyebrow">STEEM FLAGS</p><h1>Loading Steem Flags…</h1><p class="muted">Preparing the game interface.</p></section></main></div>
  <noscript><main class="appShell"><section class="card hero"><h1>Steem Flags</h1><p class="muted">JavaScript is required to play the game.</p></section></main></noscript>
  <script>
    window.addEventListener('error', function (event) {
      console.error('Steem Flags startup error:', event.error || event.message);
      const app = document.getElementById('app');
      if (app && app.querySelector('h1')?.textContent.includes('Loading')) {
        const detail = String(event.error?.message || event.message || 'JavaScript module failed to load').replace(/[<>&]/g, '');
        app.innerHTML = '<main class="appShell"><section class="card hero"><p class="eyebrow">STEEM FLAGS</p><h1>Unable to load the game</h1><p class="muted">Startup error: ' + detail + '</p><p class="muted">Please refresh the page.</p></section></main>';
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      console.error('Steem Flags startup rejection:', event.reason);
    });
  </script>
  <script src="https://unpkg.com/dsteem@0.11.3/dist/dsteem.js"></script>
  <script src="js/config.js?v=20260820-01"></script>
  <script src="js/standard-flags.js?v=20260820-01"></script>
  <script src="js/app-v2-loader.js?v=20260825-loader-03"></script>
</body>
</html>
