<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Steem Flags — Guess the flags and earn SF.">
  <title>Steem Flags</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">🚩 <span>Steem Flags</span></a>
    <div class="stats" aria-label="Player stats">
      <span>⚡ Energy <b id="energyValue">3</b></span>
      <span>🪙 SF <b id="sfValue">0</b></span>
    </div>
    <button id="menuButton" class="iconButton" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <aside id="menu" class="menu" hidden>
    <button data-action="home">Home</button>
    <button data-action="reset">Reset local game</button>
    <a href="docs/ARCHITECTURE.md">Architecture</a>
    <a href="docs/ROADMAP.md">Roadmap</a>
  </aside>

  <main class="appShell">
    <section id="homeView" class="card hero">
      <p class="eyebrow">GUESS THE FLAG</p>
      <h1>How well do you know the world?</h1>
      <p class="muted">Choose the correct country. Correct answers earn <strong>+1 SF</strong>; wrong answers cost <strong>1 SF</strong>.</p>
      <button id="startButton" class="primary">Start Game</button>
    </section>

    <section id="gameView" class="card" hidden>
      <div class="gameHeader">
        <span id="questionCounter">Question 1</span>
        <span id="scoreLabel">Score: 0</span>
      </div>
      <div class="flagWrap"><img id="flagImage" alt="Country flag"></div>
      <h2 id="questionText">Which country does this flag belong to?</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" role="status"></p>
      <button id="nextButton" class="secondary" hidden>Next question</button>
    </section>
  </main>

  <footer>Steem Flags · Frontend migration</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
