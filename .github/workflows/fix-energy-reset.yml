name: Fix Daily Energy Reset

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-worker:
    if: ${{ !contains(github.event.head_commit.message, 'Fix daily energy reset') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Worker
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare/worker.js')
          s = p.read_text()
          old_get = "async function getAccount(db,username){return await db.prepare(`SELECT Username,D2E,SteemReward,Energy,Flag FROM accounts WHERE lower(Username)=? LIMIT 1`).bind(username).first()}"
          new_get = "async function getAccount(db,username){return await db.prepare(`SELECT Username,D2E,SteemReward,Energy,Flag,LastEnergyReset FROM accounts WHERE lower(Username)=? LIMIT 1`).bind(username).first()}"
          if old_get not in s:
              raise SystemExit('getAccount pattern not found')
          s = s.replace(old_get, new_get, 1)
          old_ensure = "async function ensureAccount(db,username){await db.prepare(`INSERT INTO accounts (Username,D2E,SteemReward,Energy,Flag) VALUES (?,0,0,3,NULL) ON CONFLICT(Username) DO NOTHING`).bind(username).run();return getAccount(db,username)}"
          new_ensure = "async function ensureAccount(db,username){try{await db.prepare(`ALTER TABLE accounts ADD COLUMN LastEnergyReset TEXT`).run()}catch{};await db.prepare(`INSERT INTO accounts (Username,D2E,SteemReward,Energy,Flag) VALUES (?,0,0,6,NULL) ON CONFLICT(Username) DO NOTHING`).bind(username).run();const today=todayUTC();await db.prepare(`UPDATE accounts SET Energy=6,LastEnergyReset=? WHERE lower(Username)=? AND (LastEnergyReset IS NULL OR LastEnergyReset<>?)`).bind(today,username,today).run();return getAccount(db,username)}"
          if old_ensure not in s:
              raise SystemExit('ensureAccount pattern not found')
          s = s.replace(old_ensure, new_ensure, 1)
          p.write_text(s)
      - name: Commit Worker Fix
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix daily energy reset"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-energy-reset.yml
          git commit -m "Remove temporary energy reset workflow"
          git push
