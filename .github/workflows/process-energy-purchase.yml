name: Process Energy Purchase

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: startsWith(github.event.issue.title, '[SHOP-EVENT]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process purchase
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, datetime
          from pathlib import Path
          body=os.environ['ISSUE_BODY']; issue=int(os.environ['ISSUE_NUMBER'])
          def field(name):
              m=re.search(r'^'+re.escape(name)+r':\s*(.+)$',body,re.M|re.I)
              return m.group(1).strip() if m else ''
          if '[SHOP-EVENT]' not in body or field('type')!='energy_purchase': raise SystemExit('Not a Shop purchase')
          username=field('username').lower().lstrip('@'); energy=int(field('energy') or '0'); delta=int(field('d2e_delta') or '0'); event_id=field('event_id')
          if not re.fullmatch(r'[a-z0-9.-]{3,32}',username) or energy!=1 or delta!=-10 or not event_id: raise SystemExit('Invalid Shop purchase')
          path=Path('data/leaderboard.json'); data=json.loads(path.read_text()); player=data.setdefault('players',{}).setdefault(username,{'sf':0}); balance=int(player.get('sf',0))
          processed=data.setdefault('processed_events',[])
          if event_id in processed: raise SystemExit('Purchase already processed')
          today=datetime.datetime.now(datetime.timezone.utc).date().isoformat(); purchases=data.setdefault('energy_purchases',{}); daily=purchases.setdefault(username,{})
          if daily.get('date')!=today: daily={'date':today,'quantity':0}; purchases[username]=daily
          if int(daily.get('quantity',0))+1>10: raise SystemExit('Daily purchase limit exceeded')
          if balance<10: raise SystemExit('Insufficient D2E balance')
          player['sf']=balance-10
          player['shop_energy_pending']=int(player.get('shop_energy_pending',0))+1
          daily['quantity']=int(daily.get('quantity',0))+1
          processed.append(event_id)
          data['updated_at']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit balance and energy purchase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git commit -m "Process Shop energy purchase #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close processed issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
