name: Process Steem Flags SF events

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: steemflags-sf-ledger
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, '[SF-EVENT]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply SF event
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: python
        run: |
          import datetime, hashlib, json, os, pathlib, re, sys

          body = os.environ.get('ISSUE_BODY', '')
          issue_number = os.environ['ISSUE_NUMBER']

          def field(name):
              m = re.search(r'^' + re.escape(name) + r':\s*(.+?)\s*$', body, re.MULTILINE)
              return m.group(1).strip() if m else ''

          event_id = field('event_id')
          username = field('username').lower()
          event_type = field('type')
          delta_text = field('sf_delta')
          created_at = field('created_at')
          nonce = field('nonce')
          proof = field('proof')

          errors = []
          if not re.fullmatch(r'[A-Za-z0-9._:-]{8,128}', event_id): errors.append('invalid event_id')
          if not re.fullmatch(r'[a-z0-9.-]{3,32}', username): errors.append('invalid username')
          if event_type not in {'game_result', 'reward'}: errors.append('invalid event type')
          try:
              delta = int(delta_text)
          except ValueError:
              delta = None
          if delta is None or delta == 0 or abs(delta) > 20: errors.append('invalid sf_delta')
          if not re.fullmatch(r'[A-Za-z0-9_-]{8,128}', nonce): errors.append('invalid nonce')
          if not re.fullmatch(r'[0-9a-f]{64}', proof): errors.append('invalid proof')

          try:
              dt = datetime.datetime.fromisoformat(created_at.replace('Z', '+00:00'))
              age = abs((datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds())
              if age > 86400: errors.append('timestamp outside 24h')
          except ValueError:
              errors.append('invalid created_at')

          # Proof is only an integrity check: it prevents accidental corruption,
          # but is NOT treated as a secret and therefore is not a full anti-cheat
          # mechanism for a public static web game.
          canonical = f'{event_id}|{username}|{event_type}|{delta}|{created_at}|{nonce}'
          expected = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          if proof != expected: errors.append('invalid proof')

          if errors:
              print('Rejected:', ', '.join(errors))
              sys.exit(1)

          ledger_path = pathlib.Path('data/leaderboard.json')
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          players = ledger.setdefault('players', {})
          processed = set(ledger.setdefault('processed_events', []))

          if event_id in processed:
              print('Duplicate event; no change.')
              sys.exit(0)

          player = players.setdefault(username, {'sf': 0})
          old_sf = int(player.get('sf', 0))
          player['sf'] = max(0, old_sf + delta)
          processed.add(event_id)
          ledger['processed_events'] = sorted(processed)
          ledger['updated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Applied {delta:+d} SF to @{username}; new balance={player["sf"]}; issue={issue_number}')

      - name: Commit leaderboard
        run: |
          if git diff --quiet -- data/leaderboard.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git commit -m "Update SF leaderboard from game event"
          git push

      - name: Close processed event issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "SF event processed successfully."
