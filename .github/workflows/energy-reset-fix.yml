name: Energy Reset Fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloudflare/worker.js')
          s=p.read_text()
          old="async function getAccount(db,username){return await db.prepare(`SELECT Username,D2E,SteemReward,Energy,Flag FROM accounts WHERE lower(Username)=? LIMIT 1`).bind(username).first()}"
          new="async function getAccount(db,username){return await db.prepare(`SELECT Username,D2E,SteemReward,Energy,Flag,LastEnergyReset FROM accounts WHERE lower(Username)=? LIMIT 1`).bind(username).first()}"
          if old in s: s=s.replace(old,new,1)
          old="async function ensureAccount(db,username){await db.prepare(`INSERT INTO accounts (Username,D2E,SteemReward,Energy,Flag) VALUES (?,0,0,3,NULL) ON CONFLICT(Username) DO NOTHING`).bind(username).run();return getAccount(db,username)}"
          new="async function ensureAccount(db,username){try{await db.prepare(`ALTER TABLE accounts ADD COLUMN LastEnergyReset TEXT`).run()}catch{};await db.prepare(`INSERT INTO accounts (Username,D2E,SteemReward,Energy,Flag) VALUES (?,0,0,6,NULL) ON CONFLICT(Username) DO NOTHING`).bind(username).run();const today=todayUTC();await db.prepare(`UPDATE accounts SET Energy=6,LastEnergyReset=? WHERE lower(Username)=? AND (LastEnergyReset IS NULL OR LastEnergyReset<>?)`).bind(today,username,today).run();return getAccount(db,username)}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix daily energy reset"
          git push
