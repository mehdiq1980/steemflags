name: Buy Energy
description: Request the purchase of D2E energy through a GitHub Issue Form.
title: "[SHOP] Buy Energy"
labels:
  - shop
  - energy
body:
  - type: markdown
    attributes:
      value: |
        ## Steem Flags Shop — Energy Purchase
        Each energy costs **10 D2E**. Maximum **10 purchased energies per day**.
        Your request will be processed by GitHub Actions.
  - type: input
    id: username
    attributes:
      label: Steem username
      description: Enter the exact Steem username whose D2E balance should be charged.
      placeholder: do2earn
    validations:
      required: true
  - type: input
    id: quantity
    attributes:
      label: Energy quantity
      description: Number of energy units to buy. Maximum 10 per day.
      placeholder: "1"
      value: "1"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Purchase confirmation
      options:
        - label: I confirm that 10 D2E will be deducted for each energy unit purchased.
          required: true
