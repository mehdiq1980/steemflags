<section id="loginView" class="card hero"><h1 data-i18n="loginTitle">Steem Flags</h1><p class="muted" data-i18n="loginPrompt">Enter your Steem username and Posting Key to continue.</p><form id="loginForm"><label for="usernameInput" data-i18n="usernameLabel">Steem username</label><input id="usernameInput" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9.-]{3,32}" required><label for="postingKeyInput" data-i18n="postingKeyLabel">Posting Key</label><input id="postingKeyInput" name="postingKey" type="password" autocomplete="off" spellcheck="false" required><small class="muted" data-i18n="postingKeyNotice">Your Posting Key is verified locally and is never saved.</small><button id="loginButton" class="primary" type="submit" data-i18n="login">Login</button></form><p id="loginFeedback" class="feedback" role="status" aria-live="polite"></p></section>
